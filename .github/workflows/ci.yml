name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-e-testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Instalar dependências
        run: |
          uv venv -p 3.11 .venv
          uv pip install -e ".[all]"
      # Os hooks locais (mypy, pyright, pytest) usam .venv/bin, então o
      # pre-commit roda a mesma verificação local e no CI.
      - name: pre-commit (lint, typecheck e testes)
        run: .venv/bin/pre-commit run --all-files --show-diff-on-failure
